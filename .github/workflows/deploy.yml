name: Publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-site
  cancel-in-progress: true

jobs:
  recreate-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tear down old Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "/repos/${{ github.repository }}/pages/custom_domains/webgis-lab3.com" || true
          gh api --method DELETE "/repos/${{ github.repository }}/pages" || true
          sleep 8
          gh api --method POST "/repos/${{ github.repository }}/pages" \
            -f build_type=workflow || \
          gh api --method PUT "/repos/${{ github.repository }}/pages" \
            -f build_type=workflow -f cname=""

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

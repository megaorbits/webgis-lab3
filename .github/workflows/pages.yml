name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "/repos/${{ github.repository }}/pages/custom_domains/webgis-lab3.com" || true
          gh api --method PUT "/repos/${{ github.repository }}/pages" -F https_enforced=true -f cname="" || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
